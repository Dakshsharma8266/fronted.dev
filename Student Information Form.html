<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>11 - Student Information Form</title>
  </head>
  <body>
    <h1>Student Information</h1>
    <form action="#" method="post">
      <label for="student-name">Name:</label><br>
      <input type="text" id="student-name" name="student-name" required><br><br>

      <label for="roll">Roll Number:</label><br>
      <input type="text" id="roll" name="roll" required><br><br>

      <label for="course">Course:</label><br>
      <select id="course" name="course" required>
        <option value="" disabled selected>Select Course</option>
        <option value="cs">B.Tech - Computer Science</option>
        <option value="it">B.Tech - Information Technology</option>
        <option value="ece">B.Tech - Electronics</option>
      </select><br><br>

      <input type="submit" value="Submit">
    </form>
  </body>
</html>
