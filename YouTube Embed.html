<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>01 - YouTube Embed (Percentage Dimensions)</title>
    <!--
      This file embeds a YouTube video using iframe.
      Width and height use percentage values only so the iframe adjusts when resizing.
    -->
  </head>
  <body>
    <h1>YouTube Video Embed (Responsive via %)</h1>
    <!--
      width and height attributes are set using percentages as requested.
      Note: percentage heights are relative to the containing block's height.
    -->
    <iframe
      src="https://www.youtube.com/embed/dQw4w9WgXcQ"
      title="YouTube video player"
      width="80%"
      height="45%"
      frameborder="0"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen>
    </iframe>
  </body>
</html>
