<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>17 - Form that Loads Result in Iframe</title>
    <!--
      The form's target is the iframe below. Submitting the form loads result.html into that iframe.
    -->
  </head>
  <body>
    <h1>Submit Form</h1>
    <form action="17-result.html" method="get" target="result_iframe">
      <label for="input-text">Enter text:</label><br>
      <input type="text" id="input-text" name="input-text" required><br><br>
      <input type="submit" value="Submit">
    </form>

    <h2>Result (loaded in iframe):</h2>
    <iframe name="result_iframe" title="Result Frame" width="100%" height="200" frameborder="1"></iframe>
  </body>
</html>
