<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Image Showcase</title>
  <link rel="stylesheet" href="image-showcase.css" />
</head>
<body>
  <main>
    <header>
      <h1>Image Showcase</h1>
      <p>Grid layout with hover effects, captions and responsiveness.</p>
    </header>

    <section class="gallery">
      <figure class="card"><img src="https://picsum.photos/seed/1/600/400" alt=""><figcaption>Caption 1</figcaption></figure>
      <figure class="card"><img src="https://picsum.photos/seed/2/600/400" alt=""><figcaption>Caption 2</figcaption></figure>
      <figure class="card"><img src="https://picsum.photos/seed/3/600/400" alt=""><figcaption>Caption 3</figcaption></figure>
      <figure class="card"><img src="https://picsum.photos/seed/4/600/400" alt=""><figcaption>Caption 4</figcaption></figure>
      <figure class="card"><img src="https://picsum.photos/seed/5/600/400" alt=""><figcaption>Caption 5</figcaption></figure>
      <figure class="card"><img src="https://picsum.photos/seed/6/600/400" alt=""><figcaption>Caption 6</figcaption></figure>
    </section>
  </main>
</body>
</html>
