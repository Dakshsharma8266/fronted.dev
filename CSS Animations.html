<!-- animations.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>CSS Animations</title>
  <link rel="stylesheet" href="animations.css"/>
</head>
<body>
  <main class="container">
    <h1>CSS Animations</h1>

    <section class="anim-row">
      <div class="anim-card">
        <div class="moving"></div>
        <p>Moving box (infinite)</p>
      </div>

      <div class="anim-card">
        <div class="ball"></div>
        <p>Bouncing ball</p>
      </div>

      <div class="anim-card">
        <p class="color-text">Color changing text</p>
      </div>
    </section>
  </main>
</body>
</html>
