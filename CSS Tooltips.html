<!-- tooltips.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CSS Tooltips</title>
  <link rel="stylesheet" href="tooltips.css" />
</head>
<body>
  <main class="center">
    <h1>CSS Tooltips</h1>
    <p>Hover the items to show tooltips (CSS only).</p>

    <div class="examples">
      <div class="tooltip-item">
        <span class="trigger">🔍</span>
        <span class="tooltip">Search the site</span>
      </div>

      <div class="tooltip-item">
        <span class="trigger">ℹ️ Info</span>
        <span class="tooltip">More details about this feature</span>
      </div>

      <div class="tooltip-item">
        <button class="btn">Hover me</button>
        <span class="tooltip">Primary action (no JS)</span>
      </div>
    </div>
  </main>
</body>
</html>
