<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Responsive Image Filter Gallery</title>
  <link rel="stylesheet" href="responsive-image-filter-gallery.css">
</head>
<body>
  <header>
    <h1>Image Filter Gallery</h1>
  </header>

  <main>
    <section class="gallery" aria-label="Filtered image gallery">
      <!-- Six images with different filters applied in CSS -->
      <figure>
        <img src="https://picsum.photos/id/1015/800/600" alt="Landscape 1" />
        <figcaption>Blur</figcaption>
      </figure>

      <figure>
        <img src="https://picsum.photos/id/1025/800/600" alt="Dog" />
        <figcaption>Grayscale</figcaption>
      </figure>

      <figure>
        <img src="https://picsum.photos/id/1035/800/600" alt="City" />
        <figcaption>Sepia</figcaption>
      </figure>

      <figure>
        <img src="https://picsum.photos/id/1045/800/600" alt="Mountains" />
        <figcaption>Brightness</figcaption>
      </figure>

      <figure>
        <img src="https://picsum.photos/id/1055/800/600" alt="Sea" />
        <figcaption>Contrast</figcaption>
      </figure>

      <figure>
        <img src="https://picsum.photos/id/1065/800/600" alt="Forest" />
        <figcaption>Hue-rotate</figcaption>
      </figure>
    </section>
  </main>

  <footer>
    <p>Gallery — hover to remove filter</p>
  </footer>
</body>
</html>
