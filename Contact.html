<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact</title>
<style>
body {
  height: 100vh; display: flex; justify-content: center; align-items: center;
  background: #e1f5fe; font-family: Arial, sans-serif;
}
form {
  background: white; padding: 30px; border-radius: 10px;
  box-shadow: 0 5px 10px rgba(0,0,0,0.2); width: 300px;
}
input, textarea {
  width: 100%; padding: 10px; margin: 10px 0;
  border-radius: 5px; border: 1px solid #ccc;
}
input:focus, textarea:focus { border-color: #0288d1; outline: none; }
button {
  background: #0288d1; color: white; border: none;
  padding: 10px 20px; border-radius: 5px;
}
button:hover { background: #01579b; }
</style>
</head>
<body>
<form>
  <h2>Contact Us</h2>
  <input type="text" placeholder="Name" required>
  <input type="email" placeholder="Email" required>
  <input type="text" placeholder="Subject">
  <textarea placeholder="Message"></textarea>
  <button>Send</button>
</form>
</body>
</html>
