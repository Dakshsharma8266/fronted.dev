<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscription Panel</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

<h2>Subscription Manager</h2>

<button id="subscribe">Subscribe</button>
<button id="unsubscribe">Unsubscribe</button>

<div id="topics">
    <button class="topic">JavaScript</button>
    <button class="topic">Python</button>
    <button class="topic">Java</button>
    <button class="topic">DevOps</button>
    <button class="topic">Cloud</button>
</div>

<br><br>

<input type="text" id="newTopicName" placeholder="New topic">
<button id="addTopic">Add Topic</button>

<div id="message"></div>

<script src="q6.js"></script>
</body>
</html>
