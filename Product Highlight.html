<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Highlight</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="q2.css">
</head>
<body>

    <main>
        <h2>Product List</h2>

        <div class="product" data-stock="in" data-discount="yes">
            <h3>Product 1</h3>
            <p class="details">Extra details about product 1</p>
            <span class="fav">❤️</span>
        </div>

        <div class="product" data-stock="out">
            <h3>Product 2</h3>
            <p class="details">Extra details about product 2</p>
            <span class="fav">❤️</span>
        </div>

        <div class="product" data-stock="in" data-discount="yes">
            <h3>Product 3</h3>
            <p class="details">Extra details about product 3</p>
            <span class="fav">❤️</span>
        </div>

        <div class="product" data-stock="in">
            <h3>Product 4</h3>
            <p class="details">Extra details about product 4</p>
            <span class="fav">❤️</span>
        </div>

        <div class="product" data-stock="out" data-discount="yes">
            <h3>Product 5</h3>
            <p class="details">Extra details about product 5</p>
            <span class="fav">❤️</span>
        </div>

    </main>

    <script src="q2.js"></script>
</body>
</html>
