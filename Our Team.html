<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Team</title>
<style>
body { margin: 0; font-family: Arial, sans-serif; background: #fafafa; }
.container {
  display: flex; justify-content: center; gap: 20px;
  padding: 50px;
  flex-wrap: wrap;
}
.card {
  background: #fff; padding: 20px; width: 300px;
  border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);
  text-align: center;
}
.card img { width: 80px; border-radius: 50%; }
.card h3 { margin: 10px 0 5px; }
.card p { font-size: 0.9em; }
.highlight { background: #ffebee; border: 2px solid #f44336; }
@media (max-width:600px) { .container { flex-direction: column; align-items: center; } }
</style>
</head>
<body>
<h1 style="text-align:center;">Meet Our Team</h1>
<div class="container">
  <div class="card"><img src="https://via.placeholder.com/80"><h3>Riya Sharma</h3><p>Designer</p></div>
  <div class="card highlight"><img src="https://via.placeholder.com/80"><h3>Aditya Kumar</h3><p>Team Lead</p></div>
  <div class="card"><img src="https://via.placeholder.com/80"><h3>Neha Singh</h3><p>Developer</p></div>
</div>
</body>
</html>
