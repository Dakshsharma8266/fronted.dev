<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Combined Effects</title>
  <link rel="stylesheet" href="combined-effects.css"/>
</head>
<body>
  <main class="center">
    <h1>Combined Effects</h1>
    <p>Buttons & cards that combine pseudo-classes, transforms, and transitions.</p>

    <section class="grid">
      <button class="card-btn">Hover me</button>

      <div class="fancy-card">
        <h3>Card</h3>
        <p>Hover makes the card grow and add shadow.</p>
      </div>

      <a href="#" class="link-chip">Link chip</a>

      <button class="soft">Soft effect</button>
    </section>
  </main>
</body>
