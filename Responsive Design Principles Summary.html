<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Responsive Design Principles Summary</title>
  <link rel="stylesheet" href="responsive-design-principles-summary.css">
</head>
<body>
  <main>
    <section class="principles">
      <div class="principle">
        <h3>Fluid Layouts</h3>
        <p>Layout scales with viewport using % and minmax()</p>
        <pre><code>grid-template-columns: 1fr 2fr;</code></pre>
      </div>

      <div class="principle">
        <h3>Flexible Media</h3>
        <p>Images and media use max-width:100% and height:auto.</p>
        <pre><code>img{max-width:100%;height:auto;}</code></pre>
      </div>

      <div class="principle">
        <h3>Breakpoints</h3>
        <p>Use media queries to change layout at chosen widths.</p>
        <pre><code>@media (max-width:600px){...}</code></pre>
      </div>
    </section>
  </main>
</body>
</html>
