<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>3-section Homepage - Flexbox</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;min-height:100vh;display:flex;flex-direction:column}
  header{background:#0b5; padding:14px;color:#fff;display:flex;justify-content:space-around;align-items:center}
  header a{color:inherit;text-decoration:none;font-weight:600}
  main{flex:1;display:flex;gap:20px;padding:24px;align-items:center;justify-content:center;flex-wrap:wrap}
  .box{background:#fff;padding:24px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.06);min-width:200px;min-height:140px;display:flex;align-items:center;justify-content:center;transition:transform .25s}
  .box:hover{transform:rotate(2deg)}
  footer{background:#222;color:#fff;padding:12px;text-align:center}
  /* balance at small sizes: stack */
  @media (max-width:700px){
    main{flex-direction:column}
    header{flex-direction:column;gap:12px}
  }
</style>
</head>
<body>
  <header>
    <a href="#">Home</a>
    <a href="#">Services</a>
    <a href="#">Projects</a>
    <a href="#">Contact</a>
  </header>

  <main>
    <section class="box">Services</section>
    <section class="box">Projects</section>
    <section class="box">Contact</section>
  </main>

  <footer>© <span id="yr2"></span> Your Company — All rights reserved</footer>

<script>document.getElementById('yr2').textContent = new Date().getFullYear();</script>
</body>
</html>
