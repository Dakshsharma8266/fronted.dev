<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Filter Cards with Animation</title>
  <link rel="stylesheet" href="filter-cards-with-animation.css">
</head>
<body>
  <main>
    <section class="profiles" aria-label="Profile cards">
      <article class="profile">
        <img src="https://picsum.photos/id/1005/300/300" alt="Person 1">
        <div class="info">
          <h3>Alex Johnson</h3>
          <p>Designer</p>
        </div>
      </article>

      <article class="profile">
        <img src="https://picsum.photos/id/1011/300/300" alt="Person 2">
        <div class="info">
          <h3>Priya Rao</h3>
          <p>Developer</p>
        </div>
      </article>

      <article class="profile">
        <img src="https://picsum.photos/id/1012/300/300" alt="Person 3">
        <div class="info">
          <h3>Marcus Lee</h3>
          <p>Manager</p>
        </div>
      </article>
    </section>
  </main>
</body>
</html>
