<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Filter Comparison Layout</title>
  <link rel="stylesheet" href="filter-comparison-layout.css">
</head>
<body>
  <main class="compare">
    <figure class="before">
      <img src="https://picsum.photos/id/1003/800/600" alt="Original image">
      <figcaption>Original</figcaption>
    </figure>

    <figure class="after">
      <img src="https://picsum.photos/id/1003/800/600" alt="Filtered image">
      <figcaption>With Filter (hover to remove)</figcaption>
    </figure>
  </main>
</body>
</html>
