<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Location Selector</title>
</head>
<body>
  <header><h1>Choose Your Location</h1></header>

  <main>
    <form>
      <label for="country">Country:</label>
      <select id="country" name="country">
        <option value="india" selected>India</option>
        <option value="france">France</option>
        <option value="japan">Japan</option>
      </select>
      <br><br>

      <label for="state">State:</label>
      <select id="state" name="state">
        <option value="maharashtra" selected>Maharashtra</option>
        <option value="karnataka">Karnataka</option>
        <option value="tamilnadu">Tamil Nadu</option>
      </select>
      <br><br>

      <label for="city">City:</label>
      <select id="city" name="city">
        <option value="mumbai" selected>Mumbai</option>
        <option value="pune">Pune</option>
        <option value="bangalore">Bengaluru</option>
      </select>
      <br><br>

      <label for="place">Favorite Tourist Place:</label>
      <select id="place" name="place">
        <option value="gateway" selected>Gateway of India</option>
        <option value="marine">Marine Drive</option>
        <option value="elephanta">Elephanta Caves</option>
      </select>
    </form>

    <p>Selected: Country — India; State — Maharashtra; City — Mumbai; Favorite Place — Gateway of India.</p>
  </main>

  <footer><p>© 2025 Location Selector</p></footer>
</body>
</html>
