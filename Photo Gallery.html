<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Gallery</title>
<style>
body { margin: 0; font-family: sans-serif; background: #fafafa; }
.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 15px;
  padding: 20px;
}
.photo {
  position: relative;
  overflow: hidden;
  border-radius: 10px;
  box-shadow: 0 4px 8px rgba(0,0,0,0.2);
}
.photo img {
  width: 100%; display: block;
  transition: transform 0.3s;
}
.photo:hover img { transform: scale(1.1); }
.caption {
  position: absolute; bottom: 0;
  background: rgba(0,0,0,0.6);
  color: white; width: 100%;
  text-align: center;
  opacity: 0; transition: opacity 0.3s;
}
.photo:hover .caption { opacity: 1; }
</style>
</head>
<body>
<h1 style="text-align:center;">My Photo Gallery</h1>
<div class="gallery">
  <div class="photo"><img src="https://via.placeholder.com/400x250"><div class="caption">Image 1</div></div>
  <div class="photo"><img src="https://via.placeholder.com/400x250"><div class="caption">Image 2</div></div>
  <div class="photo"><img src="https://via.placeholder.com/400x250"><div class="caption">Image 3</div></div>
  <div class="photo"><img src="https://via.placeholder.com/400x250"><div class="caption">Image 4</div></div>
  <div class="photo"><img src="https://via.placeholder.com/400x250"><div class="caption">Image 5</div></div>
  <div class="photo"><img src="https://via.placeholder.com/400x250"><div class="caption">Image 6</div></div>
</div>
</body>
</html>
