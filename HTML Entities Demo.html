<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>12 - HTML Entities Demo</title>
    <!-- Demonstrates common HTML entities -->
  </head>
  <body>
    <h1>HTML Entities</h1>
    <p>
      Less-than: &lt; <br>
      Greater-than: &gt; <br>
      Ampersand: &amp; <br>
      Double quote: &quot; <br>
      Single quote/apostrophe: &#39; <br>
      <br>
      Copyright: &copy; <br>
      Trademark: &trade; <br>
      Registered: &reg;
    </p>
  </body>
</html>
